<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="どうぶつタッチ">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#fff4d6">
  <title>どうぶつタッチ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="field" aria-label="どうぶつ">
    <button class="animal animal--elephant" type="button" data-pitch="196" aria-label="ぞう">
      <span class="animal__face" aria-hidden="true">🐘</span>
    </button>
    <button class="animal animal--dog" type="button" data-pitch="330" aria-label="いぬ">
      <span class="animal__face" aria-hidden="true">🐶</span>
    </button>
    <button class="animal animal--cat" type="button" data-pitch="440" aria-label="ねこ">
      <span class="animal__face" aria-hidden="true">🐱</span>
    </button>
  </main>
  <script src="script.js"></script>
</body>
</html>
